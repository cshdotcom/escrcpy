name: build

# Runs on every push and PR to make sure the project always compiles with zero
# errors. The smoke build is the hard zero-error gate; lint runs in parallel
# as a non-blocking advisory check (the repo's eslint config currently hits a
# pre-existing plugin-kit compatibility bug that is unrelated to source code).

on:
  push:
    branches: [main, master, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.21.0 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
          key: pnpm-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-lint-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: true

      - name: Language sync sanity check
        run: pnpm lang-sync
        continue-on-error: true

  build-smoke:
    name: Zero-error build (vite + electron-builder config)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.21.0 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
          key: pnpm-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-build-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer (vite build) — zero-error gate
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: pnpm --filter escrcpy build

      - name: Validate electron-builder config
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: pnpm --filter escrcpy exec electron-builder --config=./electron-builder.config.js --publish=never --dir

      - name: Upload renderer dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-dist
          path: desktop/dist/
          retention-days: 7
