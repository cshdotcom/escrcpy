ignoreWorkspaceRootCheck: true

shellEmulator: true

supportedArchitectures:
  cpu: [x64, arm64]
  os: [current]

packages:
  - packages/*
  - desktop

overrides:
  '@devicefarmer/adbkit': 3.3.8
  '@vitejs/plugin-vue': 6.0.8
  '@vitejs/plugin-vue-jsx': 5.1.6
  '@vueuse/components': 14.4.0
  '@vueuse/core': 14.4.0
  '@vueuse/rxjs': 14.4.0
  sharp: 0.34.5
  tsdown: 0.22.14
  typescript: 6.0.3
  unplugin-vue: 7.2.0
  vite: 8.0.16
  vue: 3.5.41
  vue-router: 5.2.0
  vue-tsc: 3.1.8

# pnpm 12 build-script policy: explicitly allow or deny every dependency
# that ships an install script (unlisted ones make the install fail).
allowBuilds:
  electron: true
  zod: true
  esbuild: false
  sharp: false
  vue-demi: false
  electron-winstaller: false
